<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Back Bubble (Teal / Accent) -->
  <g class="bubble-back" stroke="#30c7c7" stroke-width="24">
    <!-- Speech bubble outline with tail -->
    <path d="M 64 22 
             H 232 
             A 42 42 0 0 1 274 64 
             V 208 
             A 42 42 0 0 1 232 250 
             H 162 
             L 142 308 
             A 10 10 0 0 1 123 308 
             L 108 250 
             H 64 
             A 42 42 0 0 1 22 208 
             V 64 
             A 42 42 0 0 1 64 22 
             Z" />
    <!-- Letter A -->
    <path d="M 100 206 L 148 84 L 196 206" fill="none" stroke="#30c7c7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 115 168 H 181" stroke="#30c7c7" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- Front Bubble (Black / Text Primary) -->
  <g class="bubble-front" stroke="#000000" stroke-width="24">
    <!-- Speech bubble outline with tail -->
    <path d="M 276 192 
             H 448 
             A 42 42 0 0 1 490 234 
             V 378 
             A 42 42 0 0 1 448 420 
             H 378 
             L 358 478 
             A 10 10 0 0 1 339 478 
             L 324 420 
             H 276 
             A 42 42 0 0 1 234 378 
             V 234 
             A 42 42 0 0 1 276 192 
             Z" fill="#ffffff" />
             
    <!-- Character 文 -->
    <!-- Top Dot/Vertical stroke -->
    <path d="M 362 244 V 268" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none" />
    <!-- Horizontal Crossbar -->
    <path d="M 306 272 H 418" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none" />
    <!-- Left falling stroke (pie) -->
    <path d="M 374 286 Q 346 332 304 368" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none" />
    <!-- Right falling stroke (na) -->
    <path d="M 328 308 Q 366 336 420 368" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none" />
  </g>
</svg>